name: Refresh campervan map data

on:
  workflow_dispatch:
  push:
    paths:
      - 'roads.geojson'
      - 'roads-expansion-*.geojson'
      - 'scripts/snap_routes.py'
      - 'scripts/fetch_permanent_restrictions.py'
      - 'scripts/fetch_osm_candidates.py'
      - '.github/workflows/snap-roads.yml'
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate road-following geometry
        run: python3 scripts/snap_routes.py

      - name: Refresh permanent official restrictions
        run: python3 scripts/fetch_permanent_restrictions.py

      - name: Harvest OSM restriction review candidates
        continue-on-error: true
        run: python3 scripts/fetch_osm_candidates.py

      - name: Commit generated datasets when changed
        run: |
          if git diff --quiet -- roads-snapped.geojson permanent-restrictions.geojson osm-restriction-candidates.geojson; then
            echo 'No generated-data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roads-snapped.geojson permanent-restrictions.geojson osm-restriction-candidates.geojson
          git commit -m 'Refresh generated map data'
          git push
